name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three platforms, not just Linux (2026-11-08, B233).
        #
        # WHY: the operator's run failed for a week with a receipt that
        # blamed the model, and the cause was a `cmd.exe` quoting rule that
        # only exists on Windows (B222: the Factory's own gate command
        # escaped `"` as `\"`, which is correct for `sh` and wrong for
        # `cmd.exe`, so the gate died on a correct deliverable). CI ran on
        # ubuntu only, so the platform where the defect lived was never
        # exercised by a build -- and the same class of defect (a
        # POSIX-shaped assumption in a code path that runs on Windows) can
        # ship again tomorrow.
        #
        # Every step below is offline and makes no model call, so all three
        # runners are equally green when the code is right -- verified
        # locally on Windows before this landed.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        # The Windows runtime pack is optional and platform-specific.
        run: npm ci --omit=optional

      - name: Locked dispatch test
        run: node --import tsx factory/orchestrator/test.ts

      - name: Provider route + seat pins
        run: npm run factory:route

      - name: First-run proof
        run: npm run factory:proof

      - name: Package surface
        run: node --import tsx factory/security/package-surface-test.ts

      - name: Secret redaction
        run: node --import tsx factory/security/redaction-test.ts

      - name: Approval gate + pipeline
        run: node --import tsx factory/harness/harness-test.ts

      - name: Live activity (answer stays the answer)
        run: node --import tsx factory/executor/host-output-test.ts

      - name: Status + doctor
        run: node --import tsx factory/harness/status-doctor-test.ts

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --omit=optional
      - name: Build tarball
        run: npm pack --dry-run
