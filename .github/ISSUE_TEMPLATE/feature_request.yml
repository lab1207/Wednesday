name: Feature request
description: Suggest a capability or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check [ROADMAP.md](../blob/master/ROADMAP.md) — the item
        may already be planned or explicitly out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user problem, not the implementation you have in mind
    validations:
      required: true
  - type: textarea
    id: smallest
    attributes:
      label: Smallest version that helps
      description: The smallest change that would solve the problem
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How could it be verified?
      description: What real command or test would prove it works?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
